openapi: 3.0.3
info:
  title: Smart Parking Tower Manager API
  version: 1.0.0
  description: Versioned parking-session, reservation, and occupancy reporting operations.
servers:
  - url: /
paths:
  /api/v1/facilities/{facilityId}/parking-sessions/entries:
    post:
      operationId: enterVehicle
      summary: Start a parking session
      description: A matching confirmed reservation is fulfilled atomically and linked in the response.
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryParkingSessionRequest'
            example:
              vehicleIdentifier: TOR 501
              requiredSize: SMALL
      responses:
        '201':
          description: Parking session started or matching entry request replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/facilities/{facilityId}/parking-sessions/exits:
    post:
      operationId: exitVehicle
      summary: Complete an active parking session
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExitParkingSessionRequest'
            example:
              vehicleIdentifier: TOR 501
      responses:
        '200':
          description: Parking session completed or matching exit request replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/facilities/{facilityId}/parking-sessions/active:
    get:
      operationId: findActiveParkingSession
      summary: Find a vehicle's active parking session
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/VehicleIdentifier'
      responses:
        '200':
          description: Active parking session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/facilities/{facilityId}/parking-sessions:
    get:
      operationId: listParkingSessionHistory
      summary: List a vehicle's parking-session history
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/VehicleIdentifier'
      responses:
        '200':
          description: Parking sessions ordered by newest entry first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParkingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/facilities/{facilityId}/parking-sessions/{sessionId}/receipt:
    get:
      operationId: getReceiptStatement
      summary: Get a parking receipt and its adjustment history
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Receipt statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptStatement'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/facilities/{facilityId}/parking-sessions/{sessionId}/receipt/adjustments/{adjustmentId}:
    put:
      operationId: addFeeAdjustment
      summary: Add or replay an immutable fee adjustment
      description: The client-selected adjustment identifier makes an exact retry idempotent.
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AdjustmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustFeeRequest'
      responses:
        '200':
          description: Updated receipt statement or matching adjustment replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptStatement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/facilities/{facilityId}/reservations/{reservationId}:
    put:
      operationId: createReservation
      summary: Create or replay a reservation
      description: The client-selected reservation identifier makes an exact retry idempotent.
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created or matching request replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: findReservation
      summary: Find a reservation
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Reservation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: cancelReservation
      summary: Cancel a confirmed reservation
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Cancelled reservation or matching cancellation replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/facilities/{facilityId}/reservations:
    get:
      operationId: listVehicleReservations
      summary: List a vehicle's reservation history
      parameters:
        - $ref: '#/components/parameters/FacilityId'
        - $ref: '#/components/parameters/VehicleIdentifier'
      responses:
        '200':
          description: Reservations ordered by newest creation first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/facilities/{facilityId}/occupancy:
    get:
      operationId: getOccupancy
      summary: Get a point-in-time occupancy snapshot
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Facility and floor occupancy counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancySnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/facilities/{facilityId}/occupancy/stream:
    get:
      operationId: streamOccupancy
      summary: Stream changed occupancy snapshots
      description: Sends an initial occupancy event, changed snapshots, and keepalive comments.
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Server-sent occupancy events
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/OccupancySnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    FacilityId:
      name: facilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID retained with the command result. Reuse only for an exact retry.
      schema:
        type: string
        format: uuid
    ReservationId:
      name: reservationId
      in: path
      required: true
      description: Client-selected UUID used to replay an exact create request safely.
      schema:
        type: string
        format: uuid
    VehicleIdentifier:
      name: vehicleIdentifier
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
      example: TOR 501
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdjustmentId:
      name: adjustmentId
      in: path
      required: true
      description: Client-selected UUID used to replay an exact adjustment safely.
      schema:
        type: string
        format: uuid
  schemas:
    EntryParkingSessionRequest:
      type: object
      additionalProperties: false
      required:
        - vehicleIdentifier
        - requiredSize
      properties:
        vehicleIdentifier:
          type: string
          minLength: 1
          maxLength: 32
        requiredSize:
          type: string
          enum:
            - SMALL
            - MEDIUM
            - LARGE
    ExitParkingSessionRequest:
      type: object
      additionalProperties: false
      required:
        - vehicleIdentifier
      properties:
        vehicleIdentifier:
          type: string
          minLength: 1
          maxLength: 32
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required:
        - vehicleIdentifier
        - requiredSize
        - startsAt
        - endsAt
      properties:
        vehicleIdentifier:
          type: string
          minLength: 1
          maxLength: 32
        requiredSize:
          type: string
          enum:
            - SMALL
            - MEDIUM
            - LARGE
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    Reservation:
      type: object
      required:
        - reservationId
        - facilityId
        - vehicleIdentifier
        - requiredSize
        - startsAt
        - endsAt
        - createdAt
        - status
      properties:
        reservationId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        vehicleIdentifier:
          type: string
        requiredSize:
          type: string
          enum:
            - SMALL
            - MEDIUM
            - LARGE
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - CONFIRMED
            - CANCELLED
            - FULFILLED
            - EXPIRED
        resolvedAt:
          type: string
          format: date-time
          nullable: true
    ParkingSession:
      type: object
      required:
        - sessionId
        - facilityId
        - vehicleIdentifier
        - requiredSize
        - status
        - space
        - enteredAt
      properties:
        sessionId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        vehicleIdentifier:
          type: string
        requiredSize:
          type: string
          enum:
            - SMALL
            - MEDIUM
            - LARGE
        status:
          type: string
          enum:
            - ACTIVE
            - COMPLETED
        space:
          $ref: '#/components/schemas/Space'
        enteredAt:
          type: string
          format: date-time
        exitedAt:
          type: string
          format: date-time
          nullable: true
        reservationId:
          type: string
          format: uuid
          nullable: true
          description: Reservation fulfilled by this entry, when the vehicle arrived inside its window.
        receipt:
          allOf:
            - $ref: '#/components/schemas/ParkingReceipt'
          nullable: true
          description: Immutable fee assessment returned when an exit completes.
    ParkingReceipt:
      type: object
      required:
        - receiptId
        - ratePlanId
        - ratePlanVersion
        - billableDuration
        - billingIncrements
        - grossChargeMinor
        - capDiscountMinor
        - totalMinor
        - currency
        - issuedAt
      properties:
        receiptId:
          type: string
          format: uuid
        ratePlanId:
          type: string
          format: uuid
        ratePlanVersion:
          type: integer
          format: int64
        billableDuration:
          type: string
          description: ISO 8601 duration after the grace period.
          example: PT25M
        billingIncrements:
          type: integer
          format: int64
          minimum: 0
        grossChargeMinor:
          type: integer
          format: int64
          minimum: 0
        capDiscountMinor:
          type: integer
          format: int64
          minimum: 0
        totalMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        issuedAt:
          type: string
          format: date-time
    AdjustFeeRequest:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - reason
        - reasonDetail
        - operatorReference
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: -1000000000
          maximum: 1000000000
          description: Signed amount in receipt currency minor units. Zero is rejected.
        reason:
          type: string
          enum:
            - CUSTOMER_SERVICE
            - RATE_CORRECTION
            - OPERATIONAL_EXCEPTION
            - OTHER
        reasonDetail:
          type: string
          minLength: 1
          maxLength: 240
        operatorReference:
          type: string
          minLength: 1
          maxLength: 64
          description: Unverified development identifier until authenticated identity is integrated.
    ReceiptStatement:
      type: object
      required:
        - receiptId
        - sessionId
        - ratePlanId
        - ratePlanVersion
        - sizeClass
        - enteredAt
        - exitedAt
        - billableDuration
        - billingIncrements
        - grossChargeMinor
        - capDiscountMinor
        - baseTotalMinor
        - adjustedTotalMinor
        - currency
        - issuedAt
        - adjustments
      properties:
        receiptId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        ratePlanId:
          type: string
          format: uuid
        ratePlanVersion:
          type: integer
          format: int64
        sizeClass:
          type: string
          enum:
            - SMALL
            - MEDIUM
            - LARGE
        enteredAt:
          type: string
          format: date-time
        exitedAt:
          type: string
          format: date-time
        billableDuration:
          type: string
          description: ISO 8601 duration after the grace period.
        billingIncrements:
          type: integer
          format: int64
          minimum: 0
        grossChargeMinor:
          type: integer
          format: int64
          minimum: 0
        capDiscountMinor:
          type: integer
          format: int64
          minimum: 0
        baseTotalMinor:
          type: integer
          format: int64
          minimum: 0
        adjustedTotalMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        issuedAt:
          type: string
          format: date-time
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/FeeAdjustment'
    FeeAdjustment:
      type: object
      required:
        - adjustmentId
        - amountMinor
        - reason
        - reasonDetail
        - operatorReference
        - createdAt
      properties:
        adjustmentId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          format: int64
        reason:
          type: string
          enum:
            - CUSTOMER_SERVICE
            - RATE_CORRECTION
            - OPERATIONAL_EXCEPTION
            - OTHER
        reasonDetail:
          type: string
        operatorReference:
          type: string
        createdAt:
          type: string
          format: date-time
    Space:
      type: object
      required:
        - floorNumber
        - zoneCode
        - spaceNumber
      properties:
        floorNumber:
          type: integer
          minimum: 1
        zoneCode:
          type: string
        spaceNumber:
          type: integer
          minimum: 1
    OccupancySnapshot:
      type: object
      required:
        - facilityId
        - capturedAt
        - totalSpaces
        - operationalSpaces
        - occupiedSpaces
        - availableSpaces
        - floors
      properties:
        facilityId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
        totalSpaces:
          type: integer
          format: int64
        operationalSpaces:
          type: integer
          format: int64
        occupiedSpaces:
          type: integer
          format: int64
        availableSpaces:
          type: integer
          format: int64
        floors:
          type: array
          items:
            $ref: '#/components/schemas/FloorOccupancy'
    FloorOccupancy:
      type: object
      required:
        - floorNumber
        - totalSpaces
        - operationalSpaces
        - occupiedSpaces
        - availableSpaces
      properties:
        floorNumber:
          type: integer
          minimum: 1
        totalSpaces:
          type: integer
          format: int64
        operationalSpaces:
          type: integer
          format: int64
        occupiedSpaces:
          type: integer
          format: int64
        availableSpaces:
          type: integer
          format: int64
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - timestamp
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        timestamp:
          type: string
          format: date-time
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Request parsing or validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Requested facility, parking session, or reservation was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Session, reservation state, capacity, or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Transient database failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
