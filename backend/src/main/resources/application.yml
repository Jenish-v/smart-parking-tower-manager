spring:
  application:
    name: smart-parking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_parking}
    username: ${DB_USERNAME:smart_parking}
    password: ${DB_PASSWORD:smart_parking}
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_STRUCTURED_FORMAT:ecs}
    ecs:
      service:
        environment: ${DEPLOYMENT_ENVIRONMENT:unknown}

smart-parking:
  security:
    enabled: ${SECURITY_ENABLED:true}
    issuer-uri: ${OIDC_ISSUER_URI:}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
