spring:
  application:
    name: smart-parking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_parking}
    username: ${DB_USERNAME:smart_parking}
    password: ${DB_PASSWORD:smart_parking}
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_STRUCTURED_FORMAT:ecs}
    ecs:
      service:
        environment: ${DEPLOYMENT_ENVIRONMENT:unknown}

smart-parking:
  security:
    enabled: ${SECURITY_ENABLED:true}
    issuer-uri: ${OIDC_ISSUER_URI:}

management:
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:}
      limits:
        max-attribute-value-length: 256
  tracing:
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
    propagation:
      produce: W3C
      consume: W3C
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
