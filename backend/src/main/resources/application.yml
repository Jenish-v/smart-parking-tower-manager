spring:
  application:
    name: smart-parking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_parking}
    username: ${DB_USERNAME:smart_parking}
    password: ${DB_PASSWORD:smart_parking}
  flyway:
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
