name: Local Runtime CI

on:
  pull_request:
    paths:
      - "compose.yaml"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/nginx.conf"
      - ".github/workflows/runtime-ci.yml"
  push:
    branches:
      - main
    paths:
      - "compose.yaml"
      - "backend/Dockerfile"
      - "backend/.dockerignore"
      - "frontend/Dockerfile"
      - "frontend/.dockerignore"
      - "frontend/nginx.conf"
      - ".github/workflows/runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: local-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify local runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build service images
        run: docker compose build

      - name: Start local runtime
        run: docker compose up --detach --wait

      - name: Verify backend readiness
        run: curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness

      - name: Verify reference facility
        run: |
          curl --fail --silent --show-error \
            http://localhost:8080/api/v1/facilities/d936bb7d-3027-47aa-a47b-d04a37e07310/occupancy \
            | jq --exit-status '.totalSpaces == 7200 and .availableSpaces == 7200'

      - name: Verify operator dashboard
        run: curl --fail --silent --show-error http://localhost:5173/ > /dev/null

      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local runtime
        if: always()
        run: docker compose down --volumes
