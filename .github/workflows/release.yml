name: Publish Release

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a supported semantic version" >&2
            exit 1
          fi
          grep --fixed-strings --quiet "<version>${version}</version>" backend/pom.xml
          node -e 'process.exit(require("./frontend/package.json").version === process.argv[1] ? 0 : 1)' "$version"
          grep --fixed-strings --quiet "## [${version}]" CHANGELOG.md
          test -f "docs/releases/v${version}.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for release checks
        shell: bash
        run: |
          required=("Backend CI" "Frontend CI" "Security CI" "Local Runtime CI")
          for attempt in $(seq 1 80); do
            runs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="$RELEASE_SHA" -f per_page=100)
            waiting=false
            for workflow in "${required[@]}"; do
              result=$(jq --raw-output --arg workflow "$workflow" \
                '[.workflow_runs[] | select(.name == $workflow)][0]
                 | if . == null then "missing" else "\(.status):\(.conclusion)" end' <<< "$runs")
              case "$result" in
                completed:success) ;;
                completed:*)
                  echo "$workflow finished with $result" >&2
                  exit 1
                  ;;
                *) waiting=true ;;
              esac
            done
            if [[ $waiting == false ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "release checks did not complete before the timeout" >&2
          exit 1

      - name: Publish GitHub release
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          arguments=(release create "$tag" --target "$RELEASE_SHA" --title "Smart Parking Tower Manager $tag")
          arguments+=(--notes-file "docs/releases/${tag}.md")
          if [[ $VERSION == *-* ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"
